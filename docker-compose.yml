# Base de datos PostgreSQL para desarrollo.
# Uso: docker compose up -d
# Las credenciales salen del archivo .env (no se suben al repositorio).

services:
  db:
    image: postgres:16-alpine
    container_name: emprendedoras-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PUERTO:-5432}:5432" # solo accesible desde la propia máquina
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_pg:
